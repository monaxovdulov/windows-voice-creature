[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-voice-creature"
version = "0.1.0"
description = "Windows desktop creature overlay with push-to-talk Russian voice commands."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "monaxovdulov" }
]
dependencies = [
  "PySide6>=6.7",
  "pynput>=1.7",
  "sounddevice>=0.4.6",
  "vosk>=0.3.45"
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0",
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
screen-creature = "screen_creature.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

